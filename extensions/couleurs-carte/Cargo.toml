[package]
name = "couleurs-carte"
version = "1.1.0"
edition = "2021"
description = "Extension GWS : réglage de la luminosité, de la saturation et de la netteté du fond de carte"

[lib]
crate-type = ["cdylib", "rlib"]
name = "couleurs_carte"

[dependencies]
gws-extension-api = { path = "../gws-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
